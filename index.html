<!DOCTYPE html>
<html lang="eng">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K3wty UUID Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="main-container">
    <div class="up-container">
      <div class="logo-title-wrapper">
        <img src="logo.png" class="logo" alt="Logo">
        <h1 class="title">K3wtyTools</h1>
      </div>
      <div id="github-container" class="github-container">
        <img src="github.png" class="github" alt="GitHub">
      </div>
    </div>
    <div class="uuid-container">
      <span id="uuid-text">UUID</span>
      <img src="copy.png" id="copy" class="copy" alt="Copy">
    </div>
    <button id="generate" class="generate">Generate UUID</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
